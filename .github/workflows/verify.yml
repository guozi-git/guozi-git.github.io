name: Verify static website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base_path: ['', '/guozi-website']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.base_path }}
      NEXT_PUBLIC_SITE_URL: ${{ matrix.base_path != '' && format('https://{0}.github.io{1}', github.repository_owner, matrix.base_path) || '' }}
      INDEX_SITE: ${{ matrix.base_path != '' && 'true' || 'false' }}
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run content:check && npm run papers:test
      - run: npm run build && npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Check exported files in a browser
        run: |
          npm start > /tmp/website-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail "http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH}/" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run test:static -- "http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH}/"
      - if: matrix.base_path == ''
        run: npm run test:browser
