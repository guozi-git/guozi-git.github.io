name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run content:check && npm run papers:test
      - run: npm run build && npm run typecheck
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          INDEX_SITE: 'true'
      - run: npx playwright install --with-deps chromium
      - name: Verify actual Pages path
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          INDEX_SITE: 'true'
        run: |
          npm start > /tmp/website-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail "http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH}/" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run test:static -- "http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
